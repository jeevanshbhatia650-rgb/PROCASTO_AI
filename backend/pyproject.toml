[project]
name = "procasto-ai"
version = "0.1.0"
description = "Streaming, interruptible, multi-source RAG for a smart home"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "cryptography>=43",
    "pyjwt>=2.9",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
]

[project.optional-dependencies]
dense = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
    "vulture>=2.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.vulture]
paths = ["app"]
min_confidence = 70
