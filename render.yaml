# Render blueprint: one Docker web service. New > Blueprint > pick this repo.
# Keep the public link on the simulated home: there is no login, so anyone with the URL can use it.
services:
  - type: web
    name: procasto-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DEVICE_PROVIDER
        value: sim
      - key: LLM_PROVIDER
        value: fake # set to gemini and fill GEMINI_API_KEY for LLM phrasing
      - key: GEMINI_API_KEY
        sync: false
      - key: DENSE_SEARCH
        value: "true" # "false" = BM25 only, if the free 512 MB plan runs out of memory
