# Render blueprint: one Docker web service. New > Blueprint > pick this repo.
# Signed-out visitors get a throwaway demo home; accounts and SmartThings switch on once the keys below are filled.
services:
  - type: web
    name: procasto-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render's proxy: rate limits key on the address it recorded, which visitors can't fake
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # generate once; changing it disconnects every SmartThings login
      - key: FRONTEND_URL
        sync: false # this site's public URL
      - key: PUBLIC_BASE_URL
        sync: false # same URL; SmartThings sends device events here
      - key: SMARTTHINGS_CLIENT_ID
        sync: false
      - key: SMARTTHINGS_CLIENT_SECRET
        sync: false
      - key: SMARTTHINGS_REDIRECT_URI
        sync: false # <public URL>/auth/smartthings/callback
      - key: LLM_PROVIDER
        value: fake # set to gemini and fill GEMINI_API_KEY for LLM phrasing
      - key: GEMINI_API_KEY
        sync: false
      - key: DENSE_SEARCH
        value: "true" # "false" = BM25 only, if the free 512 MB plan runs out of memory
